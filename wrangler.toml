name = "weather"
main = "worker/index.ts"
compatibility_date = "2026-05-01"

[assets]
directory = "./dist"
binding = "ASSETS"
# Only the page (for its frame-ancestors header) and the API run the Worker; other files are served directly.
run_worker_first = ["/", "/index.html", "/api/*"]

[vars]
# MET Norway requires an identifying User-Agent with a way to contact the app's owner.
MET_USER_AGENT = "DeepDiaryWeather/1.0 (+https://deepdiary.mynger.com)"
FRAME_ANCESTORS = "'self' https://deepdiary.mynger.com https://master.d3bu6ybgpdrmno.amplifyapp.com"
